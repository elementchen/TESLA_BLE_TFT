name: Build Windows Config Tool

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install pyserial pyinstaller

      - name: Build EXE
        run: |
          cd windows_flash_app
          pyinstaller --onefile --windowed --name "ESP32_Config_Tool" esp32_config_gui.py

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ESP32_Config_Tool_Windows
          path: windows_flash_app/dist/ESP32_Config_Tool.exe
